/internships/{id}:
  get:
    operationId: getInternshipById
    tags:
      - Internships
    summary: Get an internship by ID
    security:
      - OAuth2:
        - public
    parameters:
      - name: id
        in: path
        required: true
        description: The internship id
        schema:
          type: string
    responses:
      "200":
        description: An internship object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Internship"
      "400":
        $ref: '#/components/responses/ErrorResponse'
      default:
        $ref: "#/components/responses/ErrorResponse"
